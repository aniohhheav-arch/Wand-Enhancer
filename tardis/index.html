<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TARDIS — Time &amp; Dimensional Travel Simulator</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>
  :root { --bg:#04070c; --ink:#dfe9f5; --dim:#7b8aa0; --acc:#46e6ff; --warn:#ffb347; --bad:#ff5a4a; --ok:#6bff8a; --panel:rgba(6,12,22,.88); --line:rgba(120,190,255,.25); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); font:14px/1.45 ui-monospace,Menlo,Consolas,monospace; overflow:hidden; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; cursor:crosshair; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #cross { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:rgba(255,255,255,.7); box-shadow:0 0 6px rgba(70,230,255,.9); transition:transform .1s; }
  #cross.hot { transform:scale(2.2); background:var(--acc); }
  #prompt { position:absolute; left:50%; top:56%; transform:translateX(-50%); padding:6px 12px; background:var(--panel); border:1px solid var(--line); border-radius:6px; font-size:14px; display:none; text-align:center; max-width:70vw; }
  #prompt kbd, .help kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--acc); }
  #hold { position:absolute; left:50%; top:62%; width:160px; height:6px; margin-left:-80px; background:rgba(255,255,255,.15); border-radius:3px; display:none; overflow:hidden; }
  #hold i { display:block; height:100%; width:0; background:var(--acc); }
  #status { position:absolute; left:12px; top:12px; width:250px; padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; font-size:12px; }
  #status .row { display:flex; justify-content:space-between; gap:8px; } #status .bar { height:5px; background:rgba(255,255,255,.12); border-radius:3px; margin:2px 0 5px; overflow:hidden; } #status .bar i { display:block; height:100%; background:var(--ok); }
  #status .t { color:var(--acc); font-weight:700; letter-spacing:.08em; }
  #log { position:absolute; left:12px; bottom:12px; width:min(460px,60vw); display:flex; flex-direction:column; gap:4px; }
  .toast { padding:5px 10px; background:var(--panel); border-left:3px solid var(--acc); border-radius:4px; font-size:13px; animation:fade 9s forwards; }
  .toast.ship { border-color:#c9a0ff; font-style:italic; color:#e6d4ff; } .toast.sys { border-color:var(--ok); } .toast.warn { border-color:var(--bad); }
  @keyframes fade { 0%{opacity:0;transform:translateY(8px)} 6%{opacity:1;transform:none} 80%{opacity:1} 100%{opacity:0} }
  #alert { position:absolute; left:50%; top:12px; transform:translateX(-50%); max-width:min(640px,80vw); padding:8px 14px; background:rgba(60,0,0,.85); border:1px solid var(--bad); border-radius:8px; display:none; text-align:center; }
  #alert b { color:#ff9a8a; } #alert .fix { color:var(--warn); font-size:12px; }
  #scanner { position:absolute; right:12px; top:12px; width:300px; padding:10px; background:var(--panel); border:1px solid var(--acc); border-radius:8px; font-size:12px; display:none; }
  #scanner h4 { margin:0 0 6px; color:var(--acc); } #scanner .s { color:var(--dim); } #scanner .hz { color:var(--warn); }
  #keys { position:absolute; right:12px; bottom:12px; font-size:11px; color:var(--dim); text-align:right; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .5s; z-index:5; }
  .overlay { position:fixed; inset:0; z-index:10; display:none; background:rgba(2,5,12,.82); backdrop-filter:blur(4px); align-items:center; justify-content:center; }
  .overlay.on { display:flex; }
  .card { width:min(980px,94vw); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 22px; }
  h1 { margin:0 0 4px; font-size:26px; letter-spacing:.14em; color:var(--acc); font-weight:700; } h2 { margin:14px 0 6px; font-size:15px; color:var(--acc); letter-spacing:.08em; } .sub { color:var(--dim); margin:0 0 12px; }
  button, select, input { font:inherit; color:var(--ink); background:#0c1626; border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
  button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--acc); background:#102038; } button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--acc); }
  button:disabled { opacity:.4; cursor:not-allowed; } button.p { background:#0b3a52; border-color:var(--acc); } button.d { border-color:var(--bad); color:#ffb0a0; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; } .tabs button.on { background:#0b3a52; border-color:var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; } .col { display:flex; flex-direction:column; gap:6px; }
  .item { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.03); } .item .n { font-weight:700; } .item .d { color:var(--dim); font-size:12px; margin:2px 0 6px; }
  .tag { display:inline-block; padding:0 6px; border-radius:10px; font-size:11px; border:1px solid var(--line); color:var(--dim); margin-right:4px; } .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.ok { color:var(--ok); border-color:var(--ok); }
  .bar2 { height:8px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; min-width:120px; } .bar2 i { display:block; height:100%; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .row > label { min-width:150px; color:var(--dim); } .right { margin-left:auto; }
  .help td { padding:2px 14px 2px 0; color:var(--dim); } .help td:first-child { color:var(--ink); white-space:nowrap; }
  .log div { padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05); } .log .ship { color:#d9c2ff; font-style:italic; }
  #title { background:radial-gradient(ellipse at 50% 40%,rgba(20,60,160,.35),rgba(2,4,10,.96)); }
  .modes { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; margin:10px 0; } .modes button { text-align:left; padding:8px 10px; } .modes button b { display:block; color:var(--acc); } .modes button.on { background:#0b3a52; border-color:var(--acc); } .modes small { color:var(--dim); }
  @media (max-width:700px) { #status { width:200px; font-size:11px; } #keys { display:none; } }
  @media (prefers-reduced-motion:reduce) { .toast { animation-duration:12s; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="hud">
  <div id="cross"></div><div id="prompt"></div><div id="hold"><i></i></div>
  <div id="status"></div><div id="alert"></div><div id="scanner"></div><div id="log"></div>
  <div id="keys"><kbd>WASD</kbd> move · <kbd>Shift</kbd> sprint · <kbd>E</kbd>/click use · <kbd>Q</kbd>/right-click alt · <kbd>Tab</kbd> terminal · <kbd>J</kbd> archive · <kbd>F</kbd> scanner · <kbd>Esc</kbd> menu</div>
</div>
<div id="flash"></div>
<div class="overlay on" id="title"><div class="card" id="titleCard"></div></div>
<div class="overlay" id="panel"><div class="card" id="panelCard"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
