buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'com.guardsquare:proguard-gradle:7.6.1' }
}

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*') }
    }
}

dependencies {
    // bundled inside the Riftverse jar, so players don't need to install GeckoLib separately
    jarJar(implementation("software.bernie.geckolib:geckolib-neoforge-1.21.1")) {
        version {
            strictly '[4.7,5.0)'
            prefer '4.9.3'
        }
    }
}

// ---------------------------------------------------------------- obfuscation
// `./gradlew obfuscate` renames every internal class, method and field so the shipped jar is hard to read or copy.
// Names the game, NeoForge or Mixin look up by name (the @Mod class, event subscribers, mixins, enum constants and
// anything overriding Minecraft/GeckoLib code) are kept.
tasks.register('obfuscate', proguard.gradle.ProGuardTask) {
    dependsOn tasks.named('jar')
    def input = tasks.named('jar').flatMap { it.archiveFile }
    injars input
    outjars layout.buildDirectory.file("libs/${mod_id}-${mod_version}-obf.jar")
    libraryjars "${System.getProperty('java.home')}/jmods", jarfilter: '!**.jar', filter: '!module-info.class'
    libraryjars sourceSets.main.compileClasspath
    configuration file('proguard.pro')
}
