plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'com.wandcraft'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}
neoForge {
    version = neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('dev')) {
                systemProperty 'wandcraft.dev', 'true'
                if (project.hasProperty('showlist')) systemProperty 'wandcraft.showlist', project.property('showlist')
                if (project.hasProperty('show')) systemProperty 'wandcraft.show', 'true'
                if (project.hasProperty('props')) systemProperty 'wandcraft.props', 'true'
                if (project.hasProperty('dclone')) systemProperty 'wandcraft.dclone', 'true'
                if (project.hasProperty('castall')) systemProperty 'wandcraft.castall', 'true'
                programArguments.addAll('--quickPlaySingleplayer', 'devworld')
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
